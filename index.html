<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Folkevalget sover</title>
<meta name="description" content="Folkevalget holder pause. Folkevalget is taking a nap.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='10' width='24' height='18' rx='4' fill='%2373b3e6'/%3E%3Crect x='3' y='6' width='26' height='6' rx='3' fill='%23c8402f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/tokens.css">
<style>
  html, body { overflow-x: clip; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--color-paper);
    color: var(--color-ink);
    font-family: var(--font-body);
    font-size: var(--text-body);
    line-height: 1.55;
  }
  main {
    min-height: 100svh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-content: center;
    gap: var(--space-lg);
    padding: var(--space-lg) var(--space-md);
    max-width: 78rem;
    margin: 0 auto;
  }
  .words { min-width: 0; align-self: end; }
  h1 {
    margin: 0 0 var(--space-md);
    font-family: var(--font-display);
    font-weight: 700;
    font-style: normal;
    font-size: var(--text-display);
    line-height: 0.98;
    letter-spacing: -0.02em;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  h1 span { color: var(--color-accent); }
  .rule {
    width: 5rem;
    height: var(--rule-width);
    background: var(--color-accent);
    margin: 0 0 var(--space-md);
  }
  p { margin: 0 0 var(--space-sm); max-width: 32ch; }
  p.en { color: var(--color-muted); }
  .art { min-width: 0; align-self: center; }
  .art svg { display: block; width: 100%; height: auto; max-width: 34rem; margin: 0 auto; }

  .ballot { fill: var(--color-box); }
  .ballot-shade { fill: var(--color-box-shade); }
  .ink { fill: var(--color-ink); }
  .cap { fill: var(--color-accent); }
  .cream { fill: var(--color-cream); }
  .cheek { fill: var(--color-cheek); }
  .ground { fill: var(--color-shadow); }
  .stroke { fill: none; stroke: var(--color-ink); stroke-width: 5; stroke-linecap: round; }
  .paper-slip { fill: var(--color-cream); stroke: var(--color-ink); stroke-width: 2.5; }
  .z { font-family: var(--font-display); font-weight: 700; fill: var(--color-accent); }
  .drool { fill: var(--color-box); stroke: var(--color-ink); stroke-width: 2; }

  @media (prefers-reduced-motion: no-preference) {
    .z { animation: drift var(--dur-slow) var(--ease-in-out) infinite; }
    .z2 { animation-delay: 0.7s; }
    .z3 { animation-delay: 1.4s; }
    .breathe { transform-origin: 200px 322px; animation: breathe var(--dur-slow) var(--ease-in-out) infinite; }
  }
  @keyframes drift {
    0%   { transform: translateY(8px); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: translateY(-14px); opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(1.025); }
  }

  @media (min-width: 52rem) {
    main {
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: var(--space-xl);
      padding: var(--space-xl) var(--space-lg);
      align-items: center;
    }
    .words { align-self: center; }
  }
</style>
</head>
<body>
<main>
  <div class="words">
    <h1>Folkevalget <span>sover.</span></h1>
    <div class="rule" aria-hidden="true"></div>
    <p lang="da">Siden holder pause. Stemmerne er talt, kassen er lukket, og alle er gået hjem.</p>
    <p class="en" lang="en">Folkevalget is napping. Votes counted, ballot box closed, everyone gone home.</p>
  </div>
  <div class="art">
    <svg viewBox="0 0 400 360" role="img" aria-labelledby="art-title art-desc">
      <title id="art-title">En sovende stemmeboks</title>
      <desc id="art-desc">A ballot box in a red nightcap, sound asleep, with a ballot slip half stuck in its slot and a few Zs floating up.</desc>
      <ellipse class="ground" cx="200" cy="332" rx="150" ry="16"/>
      <g class="breathe">
        <rect class="ballot-shade" x="112" y="318" width="38" height="14" rx="5"/>
        <rect class="ballot-shade" x="250" y="318" width="38" height="14" rx="5"/>
        <rect class="ballot" x="92" y="150" width="216" height="172" rx="20"/>
        <rect class="ballot-shade" x="80" y="126" width="240" height="40" rx="12"/>
        <rect class="ink" x="150" y="140" width="100" height="11" rx="5.5"/>
        <g transform="rotate(-9 222 136)">
          <rect class="paper-slip" x="204" y="124" width="38" height="24" rx="3"/>
        </g>
        <path class="stroke" d="M146 226 Q164 240 182 226"/>
        <path class="stroke" d="M218 226 Q236 240 254 226"/>
        <circle class="cheek" cx="140" cy="250" r="12"/>
        <circle class="cheek" cx="260" cy="250" r="12"/>
        <ellipse class="ink" cx="200" cy="262" rx="9" ry="11"/>
        <path class="drool" d="M209 270 Q216 284 209 292 Q202 284 209 270 Z"/>
        <path class="cap" d="M106 130 C112 66 202 30 280 80 C308 98 322 124 328 150 C302 142 292 134 284 130 Z"/>
        <rect class="cream" x="98" y="120" width="196" height="16" rx="8"/>
        <circle class="cream" cx="330" cy="156" r="15"/>
      </g>
      <text class="z z1" x="58" y="108" font-size="40">Z</text>
      <text class="z z2" x="30" y="66" font-size="30">z</text>
      <text class="z z3" x="12" y="32" font-size="22">z</text>
    </svg>
  </div>
</main>
</body>
</html>
